name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'  # Only run on version tags like v1.2.3
    branches:
      - main # snapshot

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
          server-id: central
          settings-path: ${{ github.workspace }}

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: |
            src/main/frontend/node_modules
            ~/.cache/yarn
            target/node
            target/yarn
          key: ${{ runner.os }}-frontend-${{ hashFiles('src/main/frontend/yarn.lock', 'pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Generate settings.xml
        run: |
          # Maven 3.10+ requires an explicit Sonatype origin for central credentials.
          # Older Maven versions do not recognize repositoryOrigins in settings.xml.
          MAVEN_VERSION="$(./mvnw -B -Dstyle.color=never --version)"
          if [[ ! "$MAVEN_VERSION" =~ Apache\ Maven\ ([0-9]+)\.([0-9]+)\. ]]; then
            echo "Unable to determine Maven version" >&2
            exit 1
          fi
          SETTINGS_VERSION=1.0.0
          REPOSITORY_ORIGINS=
          if (( BASH_REMATCH[1] > 3 || (BASH_REMATCH[1] == 3 && BASH_REMATCH[2] >= 10) )); then
            SETTINGS_VERSION=1.3.0
            REPOSITORY_ORIGINS='<repositoryOrigins><repositoryOrigin>https://central.sonatype.com</repositoryOrigin></repositoryOrigins>'
          fi
          cat > "$GITHUB_WORKSPACE/settings.xml" <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/${SETTINGS_VERSION}"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/${SETTINGS_VERSION} https://maven.apache.org/xsd/settings-${SETTINGS_VERSION}.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.OSSRH_USERNAME }}</username>
                <password>${{ secrets.OSSRH_PASSWORD }}</password>
                ${REPOSITORY_ORIGINS}
              </server>
            </servers>
          </settings>
          EOF
      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build and Deploy to Maven Central
        run: |
          bash -e shell/install-compile-frontend.sh
          ./mvnw -U clean deploy -s $GITHUB_WORKSPACE/settings.xml -Dmaven.test.skip=false -DskipTests=false -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }}
        env:
          GPG_TTY: $(tty)
